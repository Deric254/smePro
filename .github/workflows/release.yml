name: Release

# FULLY AUTOMATED: push to main -> version auto-bumps -> a tag is
# created and pushed -> that same run builds Windows/macOS/Linux
# installers AND an Android APK -> all attached to ONE GitHub Release.
# No manual `git tag` step needed for the normal case.
#
# Commit message controls the bump size (defaults to patch):
#   git commit -m "fix: correct rounding in reports"        -> patch bump (0.1.0 -> 0.1.1)
#   git commit -m "feat: add units of measure [minor]"      -> minor bump (0.1.0 -> 0.2.0)
#   git commit -m "feat!: new module format [major]"        -> major bump (0.1.0 -> 1.0.0)
#
# Include "[skip ci]" anywhere in the commit message to push to main
# WITHOUT triggering a release at all (docs-only changes, etc.) — this
# is GitHub's own built-in convention, not something custom here.
#
# You can still cut a specific release manually the old way too:
#   git tag v1.2.3 && git push --tags
# — pushing a tag directly skips the auto-bump step and releases
# exactly that version instead.
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

# Required so the workflow can push the version-bump commit/tag back to
# the repo, and create/upload to a release.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # The actual quality gate. Without this job, nothing in this
  # pipeline ever ran a test, a lint check, or even confirmed the code
  # compiles before bumping the version, tagging it, and building real
  # installers -- a broken commit could reach a real release. Runs on
  # every trigger this workflow has (a normal push to main AND a
  # direct tag push), not just one of them, since a manually-cut
  # release deserves the same guarantee as an automatic one.
  # ------------------------------------------------------------------
  test-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check and build frontend
        run: npm run build

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --lib

  # ------------------------------------------------------------------
  # Figures out the version for this run. If triggered by a direct tag
  # push, uses that tag as-is (manual release path). If triggered by a
  # normal push to main, computes the next version from the commit
  # message, writes it into every file that needs to agree
  # (package.json, package-lock.json, tauri.conf.json, Cargo.toml),
  # commits, tags, and pushes — all in one step so there's no window
  # where those files disagree with each other or with the tag.
  # ------------------------------------------------------------------
  bump-version:
    needs: test-and-lint
    if: ${{ github.ref_type == 'tag' || !contains(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    outputs:
      new_tag: ${{ steps.resolve.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Manual path: a tag was pushed directly. Use it as-is, skip bumping.
      - name: Use pushed tag directly
        if: startsWith(github.ref, 'refs/tags/v')
        id: use-tag
        run: echo "new_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Automatic path: a normal push to main. Compute + apply the bump.
      - name: Compute and apply next version
        if: startsWith(github.ref, 'refs/heads/')
        id: auto-bump
        env:
          # Passed as an env var, NOT interpolated directly into the
          # script below — a commit message is attacker-controlled text
          # (anyone who can push, or in some setups anyone who can open
          # a PR) and textually splicing it into a shell script is a
          # real injection vector. An env var is just data to the shell,
          # no matter what it contains.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          BUMP="patch"
          if echo "$COMMIT_MSG" | grep -qiE '\[major\]'; then BUMP="major"
          elif echo "$COMMIT_MSG" | grep -qiE '\[minor\]'; then BUMP="minor"
          fi
          echo "Bump type: $BUMP (from commit message)"

          NEW_VERSION=$(npm version "$BUMP" --no-git-tag-version | sed 's/^v//')

          # Guard against a leftover tag from a previous attempt (a force
          # push resets the branch but does NOT delete tags already on
          # the remote) — keep bumping patch until we land on a version
          # that isn't already tagged, instead of failing outright.
          while git ls-remote --tags origin | grep -q "refs/tags/v${NEW_VERSION}$"; do
            echo "Tag v$NEW_VERSION already exists on the remote — bumping patch again"
            NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/^v//')
          done
          echo "New version: $NEW_VERSION"

          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path));
            conf.version = '$NEW_VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "
          # Only the [package] version at the top of the file — Cargo.toml
          # also has many dependency 'version = "..."' lines below it that
          # must NOT be touched, so this is deliberately limited to the
          # first match only.
          sed -i "0,/^version = /s/^version = .*/version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): v$NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$NEW_VERSION"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve final tag output
        id: resolve
        run: |
          if [ -n "${{ steps.use-tag.outputs.new_tag || '' }}" ]; then
            echo "new_tag=${{ steps.use-tag.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "new_tag=${{ steps.auto-bump.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Desktop: Windows / macOS (Intel + Apple Silicon) / Linux, exactly
  # as before — now just parameterized on bump-version's output tag
  # instead of the raw push ref, so it builds the exact bumped-version
  # commit whether this run came from an auto-bump or a manual tag.
  # ------------------------------------------------------------------
  desktop:
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signing key is what makes auto-update trustworthy: the
          # updater plugin verifies every downloaded update against the
          # public key baked into tauri.conf.json before installing it.
          # Generate your OWN key (`npm run tauri signer generate`) and
          # store the private half + its password as repo secrets —
          # never commit the private key itself.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.bump-version.outputs.new_tag }}
          releaseName: "SME Pro ${{ needs.bump-version.outputs.new_tag }}"
          releaseBody: "Automated release. See commit history for what changed."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ------------------------------------------------------------------
  # Android: builds a real APK and attaches it to the SAME release the
  # desktop job above creates/updates (matched by tag name — whichever
  # job finishes first creates the release, the other attaches to it).
  #
  # Uses DEBUG signing by default, which Android genuinely allows you to
  # install and run — it is NOT a placeholder or a broken build, just
  # not suitable for the Play Store. For Play Store distribution, add a
  # real release keystore as repo secrets (ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
  # and this job will automatically switch to using it instead — see
  # the "Decode signing keystore" step below, which only runs if that
  # secret is actually set.
  # ------------------------------------------------------------------
  android:
    needs: bump-version
    runs-on: ubuntu-24.04
    # NOTE ON ANDROID ARCHITECTURES: only building aarch64 (64-bit ARM)
    # and armv7 (32-bit ARM) — real Android phones. i686 and x86_64 are
    # essentially emulator-only architectures nobody's actual phone uses.
    # x86_64 additionally hit a genuine, unrelated upstream problem:
    # OpenSSL's x86_64 SM4 cipher assembly (crypto/sm4/sm4-x86_64.S)
    # uses very new CPU instructions (vsm4key4/vsm4rnds4) that NDK 26's
    # bundled assembler doesn't recognize yet — traced by reading
    # openssl-src's actual source; confirmed it has no supported way to
    # disable assembly for arbitrary targets, an OPENSSL_NO_ASM env var
    # does nothing at all for this crate (only OpenSSL's own Configure
    # script run directly reads that name).
    #
    # The actual mechanism that excludes these architectures is the
    # explicit `--target aarch64 --target armv7` flags on the
    # `tauri android build` command below — NOT which rustup targets are
    # installed. Confirmed by reading tauri-cli's own source
    # (cargo-mobile2's get_targets_or_all(): an empty target list
    # defaults to Target::all(), i.e. all four architectures regardless
    # of what rustup has installed) — an earlier version of this fix
    # tried removing the architectures from rustup alone, which looked
    # right but did nothing, proven by a real failed build log still
    # showing Gradle attempting x86_64.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new_tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Free disk space
        # A GitHub-hosted runner starts with ~14GB already used by
        # preinstalled software this job never touches (.NET, existing
        # Android emulator images, GHC, etc). Rust + the Android NDK +
        # SDK + a full Gradle build in the SAME job can genuinely run
        # the remaining space out, which shows up as a confusing failure
        # deep inside the Gradle step rather than a clear "disk full"
        # message. Clearing unused preinstalled stuff first is cheap
        # insurance against that specific failure mode.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Scaffold Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          npm run tauri android init

      - name: Write local.properties
        # Gradle traditionally reads SDK/NDK locations from this file,
        # not just from ANDROID_HOME/NDK_HOME environment variables — a
        # freshly-scaffolded project (generated mid-CI, never opened in
        # Android Studio) doesn't have one yet, and some Android Gradle
        # Plugin versions don't reliably fall back to the env vars alone
        # in a non-interactive CI shell. Writing it explicitly removes
        # that ambiguity rather than hoping the env vars are enough.
        run: |
          cat > src-tauri/gen/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/26.1.10909125
          EOF
          cat src-tauri/gen/android/local.properties

      - name: Apply loopback network security config
        # Same fix mobile-android.sh applies locally — Android blocks
        # plain HTTP by default; our backend talks to 127.0.0.1 only
        # (loopback inside the app's own process), which needs an
        # explicit exception or the app can't reach its own API.
        run: |
          XML_DIR="src-tauri/gen/android/app/src/main/res/xml"
          mkdir -p "$XML_DIR"
          cat > "$XML_DIR/network_security_config.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
              </domain-config>
          </network-security-config>
          EOF
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          path = '$MANIFEST'
          with open(path) as f:
              content = f.read()
          if 'networkSecurityConfig' not in content:
              content = re.sub(r'(<application\b)', r'\1 android:networkSecurityConfig=\"@xml/network_security_config\"', content, count=1)
              with open(path, 'w') as f:
                  f.write(content)
          "

      - name: Add REQUEST_INSTALL_PACKAGES permission (needed for in-app updates)
        # See the matching comment in mobile-android.sh — this permission
        # is confirmed-correct Android API; whether tauri-plugin-opener's
        # Android library needs an additional manually-declared
        # FileProvider was NOT verified against a real device/emulator.
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          python3 -c "
          import re
          path = '$MANIFEST'
          with open(path) as f:
              content = f.read()
          if 'REQUEST_INSTALL_PACKAGES' not in content:
              content = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />', content, count=1)
              with open(path, 'w') as f:
                  f.write(content)
          "

      # THE ACTUAL BUG THIS FIXES: Tauri's default Android Gradle
      # template has NO signingConfig at all on the "release" build
      # type (confirmed by reading tauri-cli's own template source) —
      # Android's automatic debug-signing only applies to the "debug"
      # build type, never "release". `tauri android build` (no --debug
      # flag) builds the release variant. Previously, this workflow
      # wrote a keystore.properties file when a real keystore secret
      # was configured, but NOTHING actually read that file — meaning
      # even the "real keystore" path never got wired into Gradle.
      # Every release APK this pipeline ever produced was unsigned,
      # which Android refuses to install, always, on every device,
      # regardless of what was previously installed — not a signature
      # MISMATCH, a complete absence of one.
      #
      # This step guarantees a keystore.properties + matching .keystore
      # file exist by the time Gradle runs, either from your own real
      # release keystore (repo secrets) or from a fallback keystore
      # this workflow generates and persists (via actions/cache) so
      # every build until you add a real one is signed with the SAME
      # key — installable, and consistently upgradable, just not
      # Play-Store-eligible (that still needs your own real keystore).
      # secrets.X cannot be referenced directly inside a step-level
      # `if:` — GitHub Actions' expression evaluator rejects it
      # ("Unrecognized named-value: 'secrets'"), a real error already
      # hit and fixed once this session. Route it through a step output
      # instead, which `if:` conditions ARE allowed to reference.
      - name: Check for a real release keystore secret
        id: check-keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_real_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_real_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore or create a persistent fallback keystore
        if: steps.check-keystore.outputs.has_real_keystore == 'false'
        id: fallback-keystore
        uses: actions/cache@v4
        with:
          path: src-tauri/gen/android/fallback.keystore
          key: android-fallback-keystore-v1

      - name: Generate the fallback keystore (first run only)
        if: steps.check-keystore.outputs.has_real_keystore == 'false' && steps.fallback-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/fallback.keystore \
            -alias smepro-fallback \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass smeprofallback -keypass smeprofallback \
            -dname "CN=SME Pro, OU=Fallback, O=SME Pro, L=Unknown, ST=Unknown, C=US"

      - name: Write keystore.properties (real keystore or fallback)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using your real release keystore from repo secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.keystore
            cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=release.keystore
          EOF
          else
            echo "No release keystore secret set — using the persistent fallback keystore."
            cat > src-tauri/gen/android/keystore.properties <<EOF
          password=smeprofallback
          keyAlias=smepro-fallback
          keyPassword=smeprofallback
          storeFile=fallback.keystore
          EOF
          fi

      # keystore.properties existing is necessary but not sufficient —
      # this is the step that actually makes Gradle use it. Patches the
      # generated build.gradle.kts to add a real signingConfigs block
      # and apply it to the release build type. Idempotent (checks
      # before patching) since `gen/android` is regenerated fresh each
      # run anyway, but harmless either way.
      - name: Wire the keystore into Gradle's release signing config
        run: |
          python3 - <<'PYEOF'
          path = "src-tauri/gen/android/app/build.gradle.kts"
          with open(path) as f:
              content = f.read()

          if "keystoreProperties" in content:
              print("Already patched, skipping.")
          else:
              content = "import java.io.FileInputStream\n\n" + content

              signing_config = (
                  "\n    signingConfigs {\n"
                  "        create(\"release\") {\n"
                  "            val keystorePropertiesFile = rootProject.file(\"keystore.properties\")\n"
                  "            if (keystorePropertiesFile.exists()) {\n"
                  "                val keystoreProperties = Properties()\n"
                  "                keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                  "                storeFile = rootProject.file(keystoreProperties[\"storeFile\"] as String)\n"
                  "                storePassword = keystoreProperties[\"password\"] as String\n"
                  "                keyAlias = keystoreProperties[\"keyAlias\"] as String\n"
                  "                keyPassword = keystoreProperties[\"keyPassword\"] as String\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "    buildTypes {"
              )
              content = content.replace("    buildTypes {", signing_config, 1)

              content = content.replace(
                  "        getByName(\"release\") {\n            isMinifyEnabled = true",
                  "        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"release\")\n            isMinifyEnabled = true",
                  1,
              )

              with open(path, "w") as f:
                  f.write(content)
              print("Patched build.gradle.kts with a real signingConfig.")
          PYEOF

      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN:$PATH"

          # openssl-src's build (Perl Configure + make, not just Cargo's
          # own `cc` crate machinery) needs AR/RANLIB on PATH or in env.
          # NDK r23+ (this workflow uses 26) REMOVED the old per-triple
          # GNU-binutils-style wrappers (e.g. aarch64-linux-android-ranlib)
          # entirely — only the unified, architecture-agnostic llvm-ar /
          # llvm-ranlib remain. ar/ranlib just package already-compiled
          # object files, so they don't need a per-arch variant the way a
          # compiler does — one llvm-ar correctly handles every target.
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"

          # Compilers DO need to be target- and API-level-specific — the
          # NDK provides one clang wrapper per (arch, minSdkVersion) pair.
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android21-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/armv7a-linux-androideabi21-clang"
          # THE ACTUAL FIX: without --target flags, `tauri android build`
          # defaults to building ALL FOUR architectures (aarch64, armv7,
          # i686, x86_64) regardless of what's installed via rustup —
          # confirmed by reading tauri-cli's own source (cargo-mobile2's
          # get_targets_or_all(): empty target list -> Target::all()).
          # This is why removing x86_64 from the rustup targets step
          # earlier did NOT stop Gradle from still attempting to build
          # it — that was never the actual mechanism controlling this.
          # Real phones are aarch64 (64-bit) and armv7 (32-bit) — this
          # explicitly restricts the build to just those two.
          npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Locate built APK(s)
        id: find-apk
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          echo "Found:"
          find "$APK_DIR" -name "*.apk"
          {
            echo "apk_paths<<APK_LIST_EOF"
            find "$APK_DIR" -name "*.apk"
            echo "APK_LIST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          name: "SME Pro ${{ needs.bump-version.outputs.new_tag }}"
          draft: true
          files: ${{ steps.find-apk.outputs.apk_paths }}
